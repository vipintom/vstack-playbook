name: Playbook Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate-and-release:
    name: Validate and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content
        run: pnpm validate

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ github.event.release.tag_name || inputs.version }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build distribution packages
        run: |
          pnpm run dist:package 2>&1 || pnpm pack:prod

      - name: Publish to npm
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release artifacts
        if: github.event_name == 'release'
        run: |
          # Attach distribution files to release
          gh release upload "${{ github.event.release.tag_name }}" *.tgz *.zip *.sha256 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        run: |
          echo "# Release ${{ github.event.release.tag_name || inputs.version }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "See CHANGELOG.md for details." >> RELEASE_NOTES.md

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true