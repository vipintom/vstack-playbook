name: ci

on:
  push:
    branches: [main, vstack-0.2.0]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test in the pack container
        run: docker compose run --rm pack node --test
      - name: Validate skills, playbooks and resources
        run: docker compose run --rm pack node tools/validate.js
      - name: Pack integrity
        run: docker compose run --rm pack node tools/eval-pack.js
      - name: Generated files are current
        run: |
          docker compose run --rm pack node tools/gen-docs.js
          git diff --exit-code -- docs manifest.json
      - name: Trigger smoke (report only)
        run: docker compose run --rm pack node tools/eval-triggers.js
