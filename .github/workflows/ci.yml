name: Playbook CI

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'playbooks/**'
      - 'principles/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths:
      - 'skills/**'
      - 'playbooks/**'
      - 'principles/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack structure gate
        run: bash scripts/check-structure.sh
