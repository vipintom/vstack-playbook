name: Playbook CI

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'playbooks/**'
      - 'principles/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/ci.yml'
  push:
    branches: [master]
    paths:
      - 'skills/**'
      - 'playbooks/**'
      - 'principles/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skill count must be 54
        run: |
          n=$(find skills -name SKILL.md | wc -l)
          echo "skills: $n"
          test "$n" -eq 54

      - name: Playbook count must be 13
        run: |
          n=$(find playbooks -maxdepth 1 -name '*.md' | wc -l)
          echo "playbooks: $n"
          test "$n" -eq 13

      - name: Principle count must be 12 plus index
        run: |
          n=$(find principles -maxdepth 1 -name '*.md' ! -name index.md | wc -l)
          echo "principles: $n"
          test "$n" -eq 12
          test -f principles/index.md

      - name: No forbidden sections
        run: |
          out=$(grep -rl '^## Tracking\|^## Rationalizations\|^## Modes\|^## Verification' skills playbooks principles || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
          echo "no forbidden sections"

      - name: No banned references
        run: |
          out=$(grep -rl 'manifest\.json\|vstack-runtime\|docs/deliveries' skills playbooks principles README.md AGENTS.md || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
          echo "no banned references"

      - name: Frontmatter is name+description only
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            fm=$(sed -n '/^---$/,/^---$/p' "$f" | grep -E '^[a-z-]+:' | cut -d: -f1 | sort | tr '\n' ' ')
            if [ "$fm" != "description name " ]; then
              echo "BAD $f: [$fm]"
              fail=1
            fi
          done
          exit $fail

      - name: Relative links resolve
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const roots = ['skills', 'playbooks', 'principles'];
          const files = [];
          for (const r of roots) {
            const walk = (d) => {
              for (const e of fs.readdirSync(d, { withFileTypes: true })) {
                const p = path.join(d, e.name);
                if (e.isDirectory()) walk(p);
                else if (p.endsWith('.md')) files.push(p);
              }
            };
            walk(r);
          }
          let bad = 0;
          for (const f of files) {
            const text = fs.readFileSync(f, 'utf8');
            for (const m of text.matchAll(/\]\(([^)#:]+\.md)(#[^)]*)?\)/g)) {
              const target = path.normalize(path.join(path.dirname(f), m[1]));
              if (!fs.existsSync(target)) { console.error('BROKEN ' + f + ' -> ' + m[1]); bad = 1; }
            }
          }
          process.exit(bad);
          "
