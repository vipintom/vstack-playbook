name: vstack

services:
  pack:
    build:
      context: .
      dockerfile: docker/Dockerfile
    working_dir: /work
    environment:
      VSTACK_TEST_ENV: docker
      VSTACK_RUNTIME_ROOT: /runtime
    volumes:
      - .:/work
      - ../vstack-runtime:/runtime
    command: ["sleep", "infinity"]

  runtime:
    build:
      context: ../vstack-runtime
      dockerfile: docker/Dockerfile
    working_dir: /work
    environment:
      VSTACK_TEST_ENV: docker
    volumes:
      - ../vstack-runtime:/work
    command: ["sleep", "infinity"]
